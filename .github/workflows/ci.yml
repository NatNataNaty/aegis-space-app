name: CI

# Se ejecuta en cada push y en cada pull request (antes solo se lanzaba a mano,
# así que los PR se fusionaban sin pasar tests).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium

      - name: E2E sin red (Playwright + axe)
        run: npm run test:e2e
        env:
          CI: "true"
